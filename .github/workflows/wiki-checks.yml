name: Wiki checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'openclaw/vitepress-blog-modernization']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Lint installed workflows (pinned actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test with synthetic fixtures only
        run: python3 -m unittest discover -s tests -v
      - name: Test VitePress with synthetic fixtures only
        run: npm test
      - name: Validate data contract (no preview or article logs)
        run: python3 scripts/content.py
      - name: Compile Python and check whitespace
        run: |
          python3 -m compileall -q scripts tests
          git diff --check
      # Synthetic local builds only: no Pages artifact, upload, deployment,
      # privileged events, private sources or secrets on PRs.
