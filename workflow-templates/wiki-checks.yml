name: Wiki checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'feat/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test with synthetic fixtures only
        run: python3 -m unittest discover -s tests -v
      - name: Validate data contract (no preview or article logs)
        run: python3 scripts/content.py
      # No Pages build, upload, deployment, privileged events or secrets on PRs.
