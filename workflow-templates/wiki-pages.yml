name: Publish approved wiki
on:
  push:
    branches: [master]
  workflow_dispatch:
# Absent/false opt-in means zero build/upload/deployment jobs, even after setup merge.
permissions:
  contents: read
concurrency:
  group: approved-wiki-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      vars.WIKI_PAGES_ENABLED == 'true' &&
      github.repository == 'forecs/forecs.github.io' &&
      github.ref == 'refs/heads/master' &&
      github.event.repository.default_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Exact default-branch event commit; never a PR head or moving ref.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/content.py
      - run: npm test
      # Python validates/stages only public allowlisted inputs; VitePress never
      # receives the checkout as its source or public directory. The final
      # artifact audit must succeed before this directory is uploaded.
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    if: >-
      vars.WIKI_PAGES_ENABLED == 'true' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the isolated build artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
